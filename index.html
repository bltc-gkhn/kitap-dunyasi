<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitap Dünyası</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ff9800;
            --border-color: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; }
        
        header {
            max-width: 1000px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .logo { font-size: 24px; font-weight: bold; color: var(--accent-color); }
        
        .btn {
            background-color: var(--accent-color);
            color: #000;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .container { max-width: 1000px; margin: 0 auto; }
        
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .book-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .book-cover { width: 100%; height: 260px; object-fit: cover; border-radius: 6px; }
        .book-title { font-weight: bold; font-size: 16px; color: var(--accent-color); }
        .book-author { font-size: 14px; color: #aaa; }
        .book-price { font-size: 15px; font-weight: bold; }

        .comments-section { margin-top: 10px; border-top: 1px dashed var(--border-color); padding-top: 10px; }
        .comment-item { font-size: 12px; background: #2a2a2a; padding: 6px; border-radius: 4px; margin-bottom: 5px; }
        
        .add-comment-box { display: flex; gap: 5px; margin-top: 5px; }
        .add-comment-box input {
            flex: 1;
            padding: 6px;
            background: #121212;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 4px;
            font-size: 12px;
        }
        .add-comment-box button {
            padding: 6px 10px;
            background: var(--accent-color);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
        }
        .modal-content h3 { margin-bottom: 15px; color: var(--accent-color); }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 4px; color: #aaa; }
        .form-group input {
            width: 100%;
            padding: 8px;
            background: #121212;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">📚 Kitap Dünyası</div>
        <button class="btn" onclick="openModal()">+ Yeni Kitap Ekle</button>
    </header>

    <div class="container">
        <div class="book-grid" id="bookGrid">Yükleniyor...</div>
    </div>

    <!-- KITAP EKLEME MODALI -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h3>Yeni Kitap Ekle</h3>
            <form onsubmit="handleBookSubmit(event)">
                <div class="form-group">
                    <label>Kitap Adı *</label>
                    <input type="text" id="inputTitle" required>
                </div>
                <div class="form-group">
                    <label>Yazar Adı *</label>
                    <input type="text" id="inputAuthor" required>
                </div>
                <div class="form-group">
                    <label>Kategori</label>
                    <input type="text" id="inputCategory" placeholder="Örn: Roman">
                </div>
                <div class="form-group">
                    <label>Fiyat (TL)</label>
                    <input type="number" id="inputPrice" placeholder="100">
                </div>
                <div class="form-group">
                    <label>Görsel URL</label>
                    <input type="url" id="inputCover" placeholder="https://...">
                </div>
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button type="submit" class="btn" style="flex: 1;">Kaydet</button>
                    <button type="button" class="btn" style="background: #555; color: white;" onclick="closeModal()">İptal</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // SUPABASE BAGLANTISI
        const SUPABASE_URL = "https://ljeznmysacjjutfefiyw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_3D081FZUi7fncHB2B3pACg_hAVWs68c";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // KITAPLARI CEK
        async function fetchBooks() {
            const grid = document.getElementById('bookGrid');
            const { data, error } = await _supabase
                .from('kitaplar')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                grid.innerHTML = 'Kitaplar yüklenirken hata oluştu.';
                console.error(error);
                return;
            }

            if (!data || data.length === 0) {
                grid.innerHTML = 'Henüz kitap eklenmemiş.';
                return;
            }

            grid.innerHTML = '';
            data.forEach(book => {
                const defaultImg = 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=400';
                const cover = book.gorsel || defaultImg;
                const comments = book.yorumlar || [];

                let commentsHtml = comments.map(c => `<div class="comment-item">💬 ${c}</div>`).join('');

                grid.innerHTML += `
                    <div class="book-card">
                        <img class="book-cover" src="${cover}" alt="${book.baslik}" onerror="this.src='${defaultImg}'">
                        <div class="book-title">${book.baslik}</div>
                        <div class="book-author">${book.yazar}</div>
                        <div class="book-price">${book.fiyat ? book.fiyat + ' TL' : ''}</div>
                        
                        <div class="comments-section">
                            <strong style="font-size: 11px; color: #aaa;">Yorumlar (${comments.length})</strong>
                            <div style="margin-top: 5px;">${commentsHtml}</div>
                            <div class="add-comment-box">
                                <input type="text" id="comment-input-${book.id}" placeholder="Yorum yaz...">
                                <button onclick="addComment(${book.id})">Gönder</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // YENI KITAP EKLE
        async function handleBookSubmit(e) {
            e.preventDefault();
            const newBook = {
                baslik: document.getElementById('inputTitle').value,
                yazar: document.getElementById('inputAuthor').value,
                kategori: document.getElementById('inputCategory').value,
                fiyat: document.getElementById('inputPrice').value ? parseFloat(document.getElementById('inputPrice').value) : null,
                gorsel: document.getElementById('inputCover').value,
                yorumlar: []
            };

            const { error } = await _supabase.from('kitaplar').insert([newBook]);
            if (error) {
                alert('Ekleme hatası: ' + error.message);
            } else {
                closeModal();
                fetchBooks();
            }
        }

        // YORUM EKLE
        async function addComment(bookId) {
            const input = document.getElementById(`comment-input-${bookId}`);
            const commentText = input.value.trim();
            if (!commentText) return;

            // Önce mevcut kitabı ve yorumları alalım
            const { data } = await _supabase.from('kitaplar').select('yorumlar').eq('id', bookId).single();
            const currentComments = data.yorumlar || [];
            currentComments.push(commentText);

            // Güncelleme yapalım
            const { error } = await _supabase.from('kitaplar').update({ yorumlar: currentComments }).eq('id', bookId);
            
            if (error) {
                alert('Yorum eklenemedi: ' + error.message);
            } else {
                input.value = '';
                fetchBooks();
            }
        }

        function openModal() { document.getElementById('addModal').style.display = 'flex'; }
        function closeModal() { 
            document.getElementById('addModal').style.display = 'none'; 
            document.getElementById('inputTitle').value = '';
            document.getElementById('inputAuthor').value = '';
        }

        // Sayfa açılınca kitapları getir
        fetchBooks();
    </script>
</body>
</html>
