<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitap Dünyası</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --card-hover: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-color: #ff9800;
            --danger-color: #f44336;
            --border-color: #333333;
            --modal-bg: rgba(0, 0, 0, 0.85);
            --success-color: #4caf50;
            --info-color: #2196f3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 20px;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-container {
            max-width: 1200px;
            margin: 0 auto 25px auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 8px rgba(255, 152, 0, 0.3);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 16px;
            pointer-events: none;
        }

        .no-results {
            max-width: 1200px;
            margin: 40px auto;
            text-align: center;
            color: var(--text-secondary);
            display: none;
            font-size: 16px;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .add-book-btn {
            background-color: var(--accent-color);
            color: #000;
            display: none;
        }

        .suggest-book-btn {
            background-color: var(--info-color);
            color: #fff;
            display: inline-block;
        }

        .pending-requests-btn {
            background-color: #333;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            display: none;
            position: relative;
        }

        .badge-count {
            background-color: var(--danger-color);
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 5px;
        }

        .admin-login-btn {
            background-color: #333333;
            color: #fff;
            border: 1px solid var(--border-color);
        }

        .admin-badge {
            background-color: rgba(76, 175, 80, 0.2);
            color: var(--success-color);
            border: 1px solid var(--success-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .logout-btn {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-weight: bold;
            margin-left: 5px;
        }

        .book-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
        }

        .book-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            position: relative;
            transition: transform 0.2s, background-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        .book-card:hover {
            transform: translateY(-5px);
            background-color: var(--card-hover);
        }

        .book-card-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            display: none;
            gap: 5px;
            z-index: 10;
        }

        .action-btn {
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 5px 8px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .edit-btn:hover { background: var(--accent-color); color: #000; }
        .delete-btn:hover { background: var(--danger-color); }

        .book-cover {
            width: 100%;
            height: 320px;
            object-fit: cover;
            background-color: #2b2b2b;
            cursor: pointer;
        }

        .book-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
        }

        .book-title {
            font-size: 16px;
            font-weight: bold;
        }

        .book-author {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .book-date {
            font-size: 12px;
            color: var(--accent-color);
            margin-top: 5px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--modal-bg);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            border-radius: 12px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            border: 1px solid var(--border-color);
            padding: 30px;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .close-btn:hover {
            color: var(--text-primary);
        }

        .modal-body {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .modal-cover {
            width: 220px;
            height: 320px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #2b2b2b;
        }

        .modal-details {
            flex: 1;
            min-width: 280px;
        }

        .modal-title {
            font-size: 24px;
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        .modal-author {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 15px;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent-color);
            margin-top: 15px;
            margin-bottom: 5px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .section-text {
            font-size: 14px;
            line-height: 1.6;
            color: #d0d0d0;
        }

        .input-field, .comment-input {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
            margin-bottom: 15px;
        }

        .comment-input {
            height: 80px;
            resize: none;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            font-size: 14px;
            color: var(--text-secondary);
            display: block;
        }

        .submit-btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .pending-item {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .pending-info h4 {
            color: var(--accent-color);
            margin-bottom: 4px;
        }

        .pending-info p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .pending-actions {
            display: flex;
            gap: 8px;
        }

        .approve-btn {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .reject-btn {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        body.is-admin .add-book-btn, 
        body.is-admin .pending-requests-btn { display: inline-block; }
        body.is-admin .suggest-book-btn { display: none; }
        body.is-admin .book-card-actions { display: flex; }
        body.is-admin .admin-login-btn { display: none; }
        body.is-admin .admin-badge { display: inline-flex; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Kitap Dünyası</div>
        <div class="header-actions">
            <button class="btn suggest-book-btn" onclick="openAddModal(true)">💡 Kitap Öner</button>

            <button class="btn pending-requests-btn" onclick="openPendingModal()">
                📬 Öneriler <span class="badge-count" id="pendingCount">0</span>
            </button>
            <button class="btn add-book-btn" onclick="openAddModal(false)">+ Kitap Ekle</button>

            <div class="admin-badge" id="adminBadge">
                <span>🛡️ Yönetici Modu</span>
                <button class="logout-btn" onclick="logoutAdmin()" title="Çıkış Yap">(Çıkış)</button>
            </div>
            <button class="btn admin-login-btn" onclick="loginAdmin()">🔑 Yönetici Girişi</button>
        </div>
    </header>

    <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Kitap veya yazar adı ile arayın..." oninput="handleSearch()">
    </div>

    <div class="no-results" id="noResults">
        Aradığınız kriterlere uygun kitap bulunamadı.
    </div>

    <main class="book-grid" id="bookGrid"></main>

    <div class="modal" id="bookModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('bookModal')">&times;</span>
            <div class="modal-body">
                <img class="modal-cover" id="modalImg" src="" alt="Kitap Kapağı">
                <div class="modal-details">
                    <h2 class="modal-title" id="modalTitle"></h2>
                    <div class="modal-author" id="modalAuthor"></div>
                    
                    <div class="section-title">İlk Basım Tarihi</div>
                    <div class="section-text" id="modalDate"></div>

                    <div class="section-title">Kitabın Özeti</div>
                    <div class="section-text" id="modalSummary"></div>

                    <div class="section-title">Yazar Hakkında</div>
                    <div class="section-text" id="modalAuthorBio"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="addBookModal">
        <div class="modal-content" style="max-width: 500px;">
            <span class="close-btn" onclick="closeModal('addBookModal')">&times;</span>
            <h2 id="formHeader" style="color: var(--accent-color); margin-bottom: 20px;">Yeni Kitap Ekle</h2>
            
            <form id="addBookForm" onsubmit="handleBookSubmit(event)">
                <input type="hidden" id="editIndex" value="-1">
                <input type="hidden" id="isSuggestion" value="false">
                <div class="form-group">
                    <label>Kitap Adı *</label>
                    <input type="text" id="inputTitle" class="input-field" required placeholder="Kitap adını girin">
                </div>
                <div class="form-group">
                    <label>Yazar Adı *</label>
                    <input type="text" id="inputAuthor" class="input-field" required placeholder="Yazarın adını girin">
                </div>
                <div class="form-group">
                    <label>İlk Basım Tarihi</label>
                    <input type="text" id="inputDate" class="input-field" placeholder="Örn: 1968">
                </div>
                <div class="form-group">
                    <label>Kapak Görsel Bağlantısı (URL)</label>
                    <input type="url" id="inputCover" class="input-field" placeholder="https://... (.jpg veya .png)">
                </div>
                <div class="form-group">
                    <label>Kitabın Kısa Özeti *</label>
                    <textarea id="inputSummary" class="comment-input" required placeholder="Özeti buraya yazın"></textarea>
                </div>
                <div class="form-group">
                    <label>Yazar Hakkında Bilgi</label>
                    <textarea id="inputAuthorBio" class="comment-input" placeholder="Yazar bilgilerini yazın"></textarea>
                </div>
                <button type="submit" id="submitBtn" class="submit-btn" style="width: 100%;">Kaydet</button>
            </form>
        </div>
    </div>

    <div class="modal" id="pendingModal">
        <div class="modal-content" style="max-width: 600px;">
            <span class="close-btn" onclick="closeModal('pendingModal')">&times;</span>
            <h2 style="color: var(--accent-color); margin-bottom: 20px;">📬 Onay Bekleyen Öneriler</h2>
            <div id="pendingList"></div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "1234";

        const defaultBooks = [
            {
                title: "Şeker Portakalı",
                author: "José Mauro de Vasconcelos",
                date: "1968",
                cover: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400",
                summary: "Brezilya'nın Rio de Janeiro kentinde yaşayan Zezé adındaki küçük, yaramaz ama duygusal bir çocuğun iç dünyasını ve çevresiyle olan ilişkisini anlatır.",
                authorBio: "José Mauro de Vasconcelos (1920-1984), Brezilyalı yazar. Kendi yaşam deneyimlerini yalın bir dille aktardığı eserleriyle tanınır."
            },
            {
                title: "Simyacı",
                author: "Paulo Coelho",
                date: "1988",
                cover: "https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=400",
                summary: "Endülüs'ten başlayıp Mısır Piramitleri'ne uzanan bir yolculuğa çıkan Çoban Santiago'nun kendi 'Kişisel Menkıbe'sini arama serüvenini konu alır.",
                authorBio: "Paulo Coelho, Brezilyalı roman ve söz yazarıdır. Eserleri onlarca dile çevrilmiş ve dünya çapında milyonlarca satmıştır."
            },
            {
                title: "Kürk Mantolu Madonna",
                author: "Sabahattin Ali",
                date: "1943",
                cover: "https://images.unsplash.com/photo-1512820790803-83ca734da794?w=400",
                summary: "Berlin'e giden tutuk karakterli Raif Efendi'nin, orada tanıştığı Maria Puder ile yaşadığı unutulmaz ve hüzünlü aşk hikayesini anlatır.",
                authorBio: "Sabahattin Ali (1907-1948), Türk edebiyatının en önemli toplumcu gerçekçi yazar, şair ve öğretmenlerindendir."
            },
            {
                title: "1984",
                author: "George Orwell",
                date: "1949",
                cover: "https://images.unsplash.com/photo-1532012197267-da84d127e765?w=400",
                summary: "Büyük Birader'in mutlak gözetimi altındaki distopik bir dünyada, hakikati arayan Winston Smith'in sisteme başkaldırma çabasını konu edinir.",
                authorBio: "George Orwell (1903-1950), İngiliz roman yazarı, gazeteci ve eleştirmen. Siyasi hiciv ve distopya türündeki eserleriyle meşhurdur."
            },
            {
                title: "Küçük Prens",
                author: "Antoine de Saint-Exupéry",
                date: "1943",
                cover: "https://images.unsplash.com/photo-1516979187457-637abb4f9353?w=400",
                summary: "Sahra Çölü'ne düşen bir pilotun, başka bir gezegenden gelen Küçük Prens ile tanışmasını ve onun gözünden insan ilişkilerini sorgulamasını anlatır.",
                authorBio: "Antoine de Saint-Exupéry (1900-1944), Fransız pilot ve yazar. Eserlerinde insan sevgisi ve hayatın anlamı temalarını işler."
            },
            {
                title: "Suç ve Ceza",
                author: "Fyodor Dostoyevski",
                date: "1866",
                cover: "https://images.unsplash.com/photo-1457369804613-52c61a468e7d?w=400",
                summary: "Yoksul bir öğrenci olan Raskolnikov'un, toplum yararı için işlediğini düşündüğü cinayet sonrası yaşadığı derin vicdan azabı ve psikolojik çöküşü işler.",
                authorBio: "Fyodor Dostoyevski (1821-1881), Rus edebiyatının ve dünya romanının en büyük psikolojik tahlil ustalarındandır."
            },
            {
                title: "Tutunamayanlar",
                author: "Oğuz Atay",
                date: "1971",
                cover: "https://images.unsplash.com/photo-1497633762265-9d179a990aa6?w=400",
                summary: "Turgut Özben'in, intihar eden arkadaşı Selim Işık'ın geçmişinin izini sürerken modern toplumdaki yalnızlığını ve bireyin iç çatışmalarını keşfetmesini anlatır.",
                authorBio: "Oğuz Atay (1934-1977), Türk edebiyatında postmodern tarzda eser veren ilk ve en önemli yazarlardan biridir."
            },
            {
                title: "Dönüşüm",
                author: "Franz Kafka",
                date: "1915",
                cover: "https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=400",
                summary: "Gregor Samsa'nın bir sabah dev bir böceğe dönüşmesiyle başlayan ve ailesi ile toplum tarafından dışlanmasını konu alan sarsıcı bir uzun öyküdür.",
                authorBio: "Franz Kafka (1883-1924), 20. yüzyılın en etkili Prag doğumlu modernist yazarlarındandır."
            },
            {
                title: "Bülbülü Öldürmek",
                author: "Harper Lee",
                date: "1960",
                cover: "https://images.unsplash.com/photo-1476275466078-4007374efbbe?w=400",
                summary: "ABD'nin güneyinde ırkçılığın hüküm sürdüğü bir kasabada, haksız yere suçlanan siyah bir adamı savunan avukat Atticus Finch ve kızı Scout'un gözünden adalet kavramını anlatır.",
                authorBio: "Harper Lee (1926-2016), Pulitzer ödüllü Amerikalı yazar."
            },
            {
                title: "Fahrenheit 451",
                author: "Ray Bradbury",
                date: "1953",
                cover: "https://images.unsplash.com/photo-1506880018603-83d5b814b5a6?w=400",
                summary: "Kitapların yasaklandığı ve itfaiyecilerin yangın söndürmek yerine kitap yaktığı gelecekteki bir dünyada, itfaiyeci Guy Montag'ın uyanışını konu alır.",
                authorBio: "Ray Bradbury (1920-2012), bilimkurgu ve fantezi türünde unutulmaz eserler vermiş Amerikalı yazar."
            }
        ];

        let books = JSON.parse(localStorage.getItem('my_books')) || defaultBooks;
        let pendingBooks = JSON.parse(localStorage.getItem('my_pending_books')) || [];

        function saveToStorage() {
            localStorage.setItem('my_books', JSON.stringify(books));
            localStorage.setItem('my_pending_books', JSON.stringify(pendingBooks));
        }

        function loginAdmin() {
            const password = prompt("Lütfen Yönetici Şifresini Giriniz:");
            if (password === ADMIN_PASSWORD) {
                document.body.classList.add('is-admin');
                alert("Yönetici girişi başarılı!");
            } else if (password !== null) {
                alert("Hatalı şifre!");
            }
        }

        function logoutAdmin() {
            document.body.classList.remove('is-admin');
            alert("Yönetici oturumu kapatıldı.");
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filteredBooks = books.filter(book => 
                book.title.toLowerCase().includes(query) || 
                book.author.toLowerCase().includes(query)
            );
            renderBooks(filteredBooks);
        }

        function renderBooks(filteredList = books) {
            const grid = document.getElementById('bookGrid');
            const noResults = document.getElementById('noResults');
            grid.innerHTML = '';
            
            if (filteredList.length === 0) {
                noResults.style.display = 'block';
            } else {
                noResults.style.display = 'none';
            }

            filteredList.forEach((book) => {
                const originalIndex = books.indexOf(book);
                const defaultImage = 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=400';
                const coverUrl = book.cover && book.cover.trim() !== '' ? book.cover : defaultImage;

                grid.innerHTML += `
                    <div class="book-card">
                        <div class="book-card-actions">
                            <button class="action-btn edit-btn" onclick="editBook(${originalIndex})" title="Düzenle">✎ Düzenle</button>
                            <button class="action-btn delete-btn" onclick="deleteBook(${originalIndex})" title="Sil">✕ Sil</button>
                        </div>
                        <img class="book-cover" src="${coverUrl}" alt="${book.title}" onerror="this.src='${defaultImage}'" onclick="openBookModal(${originalIndex})">
                        <div class="book-info" onclick="openBookModal(${originalIndex})">
                            <div class="book-title">${book.title}</div>
                            <div class="book-author">${book.author}</div>
                            <div class="book-date">Basım: ${book.date || 'Bilinmiyor'}</div>
                        </div>
                    </div>
                `;
            });

            updatePendingBadge();
        }

        function updatePendingBadge() {
            document.getElementById('pendingCount').innerText = pendingBooks.length;
        }

        function deleteBook(index) {
            if (confirm(`"${books[index].title}" kitabını silmek istediğinizden emin misiniz?`)) {
                books.splice(index, 1);
                saveToStorage();
                handleSearch();
            }
        }

        function editBook(index) {
            const book = books[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('isSuggestion').value = "false";
            document.getElementById('inputTitle').value = book.title;
            document.getElementById('inputAuthor').value = book.author;
            document.getElementById('inputDate').value = book.date || '';
            document.getElementById('inputCover').value = book.cover || '';
            document.getElementById('inputSummary').value = book.summary;
            document.getElementById('inputAuthorBio').value = book.authorBio || '';

            document.getElementById('formHeader').innerText = "Kitabı Düzenle";
            document.getElementById('submitBtn').innerText = "Değişiklikleri Kaydet";
            openAddModal(false);
        }

        function openBookModal(index) {
            const book = books[index];
            const defaultImage = 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=400';
            
            document.getElementById('modalImg').src = book.cover && book.cover.trim() !== '' ? book.cover : defaultImage;
            document.getElementById('modalTitle').innerText = book.title;
            document.getElementById('modalAuthor').innerText = book.author;
            document.getElementById('modalDate').innerText = book.date || 'Belirtilmedi';
            document.getElementById('modalSummary').innerText = book.summary;
            document.getElementById('modalAuthorBio').innerText = book.authorBio || 'Bilgi bulunmuyor.';

            document.getElementById('bookModal').classList.add('active');
        }

        function openAddModal(isSuggestion = false) {
            document.getElementById('isSuggestion').value = isSuggestion ? "true" : "false";
            
            if (isSuggestion) {
                document.getElementById('formHeader').innerText = "💡 Kitap Önerisinde Bulun";
                document.getElementById('submitBtn').innerText = "Öneriyi Gönder";
            } else if (document.getElementById('editIndex').value === "-1") {
                document.getElementById('formHeader').innerText = "Yeni Kitap Ekle";
                document.getElementById('submitBtn').innerText = "Yayınla";
            }

            document.getElementById('addBookModal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
            if (modalId === 'addBookModal') {
                document.getElementById('addBookForm').reset();
                document.getElementById('editIndex').value = "-1";
                document.getElementById('isSuggestion').value = "false";
            }
        }

        function handleBookSubmit(event) {
            event.preventDefault();

            const editIndex = parseInt(document.getElementById('editIndex').value);
            const isSuggestion = document.getElementById('isSuggestion').value === "true";

            const bookData = {
                title: document.getElementById('inputTitle').value,
                author: document.getElementById('inputAuthor').value,
                date: document.getElementById('inputDate').value,
                cover: document.getElementById('inputCover').value,
                summary: document.getElementById('inputSummary').value,
                authorBio: document.getElementById('inputAuthorBio').value
            };

            if (isSuggestion) {
                pendingBooks.unshift(bookData);
                alert("Öneriniz yöneticilere iletildi! Teşekkür ederiz.");
            } else if (editIndex === -1) {
                books.unshift(bookData);
            } else {
                books[editIndex] = bookData;
            }

            saveToStorage();
            handleSearch();
            closeModal('addBookModal');
        }

        function openPendingModal() {
            const list = document.getElementById('pendingList');
            list.innerHTML = '';

            if (pendingBooks.length === 0) {
                list.innerHTML = '<p style="color: var(--text-secondary); text-align: center; padding: 20px;">Onay bekleyen kitap önerisi bulunmuyor.</p>';
            } else {
                pendingBooks.forEach((item, index) => {
                    list.innerHTML += `
                        <div class="pending-item">
                            <div class="pending-info">
                                <h4>${item.title}</h4>
                                <p><strong>Yazar:</strong> ${item.author} (${item.date || 'Tarih yok'})</p>
                                <p style="margin-top:5px;">${item.summary.substring(0, 90)}...</p>
                            </div>
                            <div class="pending-actions">
                                <button class="approve-btn" onclick="approveSuggestion(${index})">✓ Onayla</button>
                                <button class="reject-btn" onclick="rejectSuggestion(${index})">✕ Reddet</button>
                            </div>
                        </div>
                    `;
                });
            }

            document.getElementById('pendingModal').classList.add('active');
        }

        function approveSuggestion(index) {
            const approvedBook = pendingBooks.splice(index, 1)[0];
            books.unshift(approvedBook);
            saveToStorage();
            handleSearch();
            openPendingModal();
        }

        function rejectSuggestion(index) {
            if (confirm("Bu öneriyi reddetmek istediğinizden emin misiniz?")) {
                pendingBooks.splice(index, 1);
                saveToStorage();
                updatePendingBadge();
                openPendingModal();
            }
        }

        renderBooks();
    </script>
</body>
</html>
